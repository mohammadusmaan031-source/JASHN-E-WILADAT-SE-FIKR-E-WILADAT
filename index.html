<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Registration Form</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .form-container {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .form-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .form-header h2 {
      color: #1a365d;
      font-size: 22px;
      margin-bottom: 5px;
    }

    .form-header p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #2b6cb0;
    }

    /* Payment Section Styling */
    .payment-box {
      background: #f8fafc;
      border: 2px dashed #cbd5e0;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .payment-box h3 {
      color: #2b6cb0;
      font-size: 16px;
      margin-bottom: 8px;
    }

    .fee-badge {
      display: inline-block;
      background: #e2e8f0;
      color: #2d3748;
      font-weight: bold;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .qr-code-img {
      width: 220px;
      height: 220px;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: #fff;
      padding: 5px;
    }

    .payment-instruction {
      font-size: 13px;
      color: #4a5568;
      margin-top: 10px;
      line-height: 1.4;
    }

    .submit-btn {
      width: 100%;
      background-color: #2b6cb0;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .submit-btn:hover {
      background-color: #2c5282;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <div class="form-header">
      <h2>Registration Form</h2>
      <p>Kripya apni sahi jankari bharein</p>
    </div>

    <form action="#" method="POST" enctype="multipart/form-data">
      
      <!-- Student Details -->
      <div class="form-group">
        <label for="fullname">Pura Naam (Full Name) *</label>
        <input type="text" id="fullname" name="fullname" placeholder="Apna pura naam likhein" required>
      </div>

      <div class="form-group">
        <label for="mobile">Mobile / WhatsApp Number *</label>
        <input type="tel" id="mobile" name="mobile" placeholder="10 digit ka number" required pattern="[0-9]{10}">
      </div>

      <div class="form-group">
        <label for="city">Sahar / Zila (City/District) *</label>
        <input type="text" id="city" name="city" placeholder="Apne sahar ka naam likhein" required>
      </div>

      <!-- Payment Section -->
      <div class="payment-box">
        <h3>Payment QR Code</h3>
        <div class="fee-badge">Registration Fees: ₹313</div>
        
        <div>
          <img src="https://ibb.co/Z6v9zYY9" alt="Registration Fees QR Code" class="qr-code-img">
        </div>
        
        <p class="payment-instruction">
          GPay / PhonePe / Paytm se QR Code scan karke <strong>₹313</strong> pay karein aur Transaction ID niche fill karein.
        </p>
      </div>

      <!-- Payment Verification -->
      <div class="form-group">
        <label for="utr">Transaction ID / UTR Number *</label>
        <input type="text" id="utr" name="utr" placeholder="12 digit ka UTR/Ref number" required>
      </div>

      <div class="form-group">
        <label for="screenshot">Payment Screenshot Upload Karein *</label>
        <input type="file" id="screenshot" name="screenshot" accept="image/*" required>
      </div>

      <button type="submit" class="submit-btn">Submit Registration</button>
      
    </form>
  </div>

</body>
</html>
