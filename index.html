<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jashn-e-Wiladat Se Fikr-e-Wiladat - Registration Form</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #1a5f7a;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input[type="text"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        .qr-section {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: #eef7f6;
            border-radius: 8px;
            border: 2px dashed #1a5f7a;
        }
        .fee-note {
            font-size: 13px;
            color: #1a5f7a;
            font-weight: bold;
            margin-bottom: 12px;
            line-height: 1.5;
            background: #ffffff;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #bce1ec;
        }
        .qr-section img {
            max-width: 220px;
            width: 100%;
            height: auto;
            border-radius: 6px;
            margin: 10px 0;
            border: 1px solid #ddd;
        }
        .submit-btn {
            width: 100%;
            background-color: #1a5f7a;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .submit-btn:hover {
            background-color: #13465a;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Jashn-e-Wiladat Se Fikr-e-Wiladat</h2>
    <form>
        <!-- Full Name -->
        <div class="form-group">
            <label for="name">Full Name (Pura Naam):</label>
            <input type="text" id="name" name="name" placeholder="Apna naam likhein" required>
        </div>

        <!-- Father Name -->
        <div class="form-group">
            <label for="fname">Father's Name (Walid Ka Naam):</label>
            <input type="text" id="fname" name="fname" placeholder="Walid ka naam likhein" required>
        </div>

        <!-- WhatsApp Number -->
        <div class="form-group">
            <label for="whatsapp">WhatsApp Number:</label>
            <input type="tel" id="whatsapp" name="whatsapp" placeholder="Apna WhatsApp number likhein" required>
        </div>

        <!-- Address -->
        <div class="form-group">
            <label for="address">Address (Pata):</label>
            <textarea id="address" name="address" placeholder="Apna pura address likhein" required></textarea>
        </div>

        <!-- Payment & QR Code Section -->
        <div class="qr-section">
            <!-- Mandatory Note -->
            <div class="fee-note">
                ye mamuli si registration fees sanjeeda aur paband logon ko jodne aur management ke liye li ja rahi h
            </div>

            <label style="font-size: 15px; color: #333; font-weight: bold;">Scan & Pay Registration Fee:</label><br>
            
            <!-- Direct Image from ImgBB -->
            <img src="https://i.ibb.co/Z6v9zYY9/image.jpg" alt="Registration Fee QR Code">
            
            <p style="font-size: 12px; color: #666; margin-top: 5px;">QR code scan karke fees pay karein aur Submit button par click karein.</p>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn">Submit Registration</button>
    </form>
</div>

</body>
</html>
